<section class="mainContainer">
  <div class="difficulty-panel">
    <p class="difficulty-eyebrow">Choose Mode</p>
    <h1 class="difficulty-title">Difficulty</h1>
    <div class="selectionButtons">
      <button type="button" class="btn-selector" (click)="selectDifficulty('easy')">
        <span class="btn-label">Easy</span>
        <span class="btn-meta">2 × 2</span>
      </button>
      <button type="button" class="btn-selector" (click)="selectDifficulty('medium')">
        <span class="btn-label">Medium</span>
        <span class="btn-meta">4 × 2</span>
      </button>
      <button type="button" class="btn-selector" (click)="selectDifficulty('hard')">
        <span class="btn-label">Hard</span>
        <span class="btn-meta">4 × 3</span>
      </button>
    </div>
  </div>
</section>

<router-outlet></router-outlet>
