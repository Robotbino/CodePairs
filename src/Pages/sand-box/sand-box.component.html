<div class="sandbox-layout">
  <div class="game-container" [style.width.px]="gridWidth">

    <header class="game-header">
      <h1 class="game-title">Memory<br>Leak</h1>
      <div class="game-stats">
        <div class="stat">
          <span class="stat-label">Score</span>
          <span class="stat-value">{{currentPlayer.score}}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Lives</span>
          <span class="stat-value">{{currentPlayer.attemptsRemaining}}</span>
        </div>
      </div>
    </header>

    <div class="game-board" [style.--grid-cols]="gridCols">
      <div *ngFor="let card of cards" (click)="handleCardClick(card)" class="flip-card" [class.flipped]="card.isFlipped">
        <div class="flip-card-inner">
          <div class="flip-card-front">
            <img [src]="card.backside" alt="Card Back" class="imgCardBack">
          </div>
          <div class="flip-card-back">
            <div class="card-icon" [innerHTML]="card.source"></div>
          </div>
        </div>
      </div>
    </div>

    <footer class="game-footer">
      <button class="resetButton" (click)="resetGame()">Reset Game</button>
    </footer>

  </div>
</div>
<router-outlet></router-outlet>
