<div class="hud">
  <div class="hud__stat">
    <span class="hud__label">Score</span>
    <span class="hud__value hud__value--score">{{ score() }}</span>
  </div>

  <div class="hud__stat">
    <span class="hud__label">Time</span>
    <span class="hud__value hud__value--time">{{ time() }}</span>
  </div>

  <div class="hud__stat">
    <span class="hud__label">Lives</span>
    <span
      class="hud__pips"
      role="img"
      [style.--pip-cols]="pipCols()"
      [attr.aria-label]="lives() + ' of ' + maxLives() + ' lives left'"
    >
      @for (alive of livesArray(); track $index) {
        <span class="hud__pip" [class.hud__pip--out]="!alive"></span>
      }
    </span>
  </div>

  <div class="hud__stat hud__stat--combo" [class.is-hot]="showCombo()">
    <span class="hud__label">Combo</span>
    @if (showCombo()) {
      <!-- Re-created whenever the multiplier changes, so the pop replays. -->
      @for (m of [multiplier()]; track m) {
        <span class="hud__value hud__value--combo">
          <span aria-hidden="true">{{ m }}×<small>×{{ combo() }}</small></span>
          <span class="sr-only">{{ m }} times, {{ combo() }} in a row</span>
        </span>
      }
    } @else {
      <span class="hud__value hud__value--idle">
        <span aria-hidden="true">—</span><span class="sr-only">none</span>
      </span>
    }
  </div>
</div>
