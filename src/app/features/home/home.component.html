<main class="home">
  <div class="hero">
    <p class="hero__eyebrow cp-chip">Memory card game</p>
    <h1 class="hero__title" aria-label="Code Pairs">CODE<span>PAIRS</span></h1>
    <p class="hero__subtitle">Match the tokens. Mind the leak.</p>

    <a class="cp-btn cp-btn--primary cp-btn--lg" routerLink="/difficulty">
      <span class="cp-btn__face">Play</span>
    </a>
  </div>

  <section class="scores" aria-labelledby="scores-heading">
    <h2 class="scores__heading" id="scores-heading">High scores</h2>
    <ul class="scores__list">
      @for (row of bestRows; track row.difficulty) {
        <li class="scores__row">
          <span class="scores__level">{{ row.label }}</span>
          @if (best(row.difficulty); as b) {
            <span class="scores__stat">
              <b>{{ b.score }}</b>
              <span aria-hidden="true">·</span>
              {{ b.time }}
              <span class="sr-only">Rank</span>
              <span class="scores__rank" [attr.data-grade]="b.rank">{{
                b.rank
              }}</span>
            </span>
          } @else {
            <span class="scores__stat scores__stat--empty">Not played yet</span>
          }
        </li>
      }
    </ul>
  </section>
</main>
